<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Spinner Demo</title>
  <style>
    :root {
      --color-primary: #14b8a6;
      --color-secondary: #0d9488;
      --color-accent: #38bdf8;
      --color-background: #020617;
      --color-foreground: #e2e8f0;
      --color-card: #0f172a;
      --color-muted: #1e293b;
      --color-border: #334155;
      --radius-sm: 0.25rem;
      --radius-lg: 0.5rem;
      --radius-xl: 0.75rem;
      --shadow-md: 0 4px 6px rgba(20, 184, 166, 0.15), 0 2px 4px rgba(0, 0, 0, 0.4);
      --font-body: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
      margin: 0;
      padding: 0;
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .demo-container {
      background: var(--color-card);
      padding: 3rem;
      border-radius: var(--radius-xl);
      box-shadow: 0 10px 25px rgba(20, 184, 166, 0.2), 0 4px 6px rgba(0, 0, 0, 0.5);
    }

    h1 {
      color: var(--color-foreground);
      text-align: center;
      margin-bottom: 2rem;
    }

    .spinner-examples {
      display: flex;
      flex-direction: column;
      gap: 3rem;
      align-items: center;
    }

    .example {
      text-align: center;
    }

    .example-label {
      color: var(--color-accent);
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Loading Spinner Container */
    .loading-spinner-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 2rem;
    }

    .loading-spinner-container.inline {
      padding: 1rem;
    }

    /* TicTacToe Grid Animation */
    .loading-spinner {
      position: relative;
      display: inline-block;
    }

    .loading-spinner.small {
      --cell-size: 1.5rem;
      --grid-gap: 0.25rem;
      --piece-stroke: 2px;
    }

    .loading-spinner.medium {
      --cell-size: 2rem;
      --grid-gap: 0.375rem;
      --piece-stroke: 2.5px;
    }

    .loading-spinner.large {
      --cell-size: 2.5rem;
      --grid-gap: 0.5rem;
      --piece-stroke: 3px;
    }

    .tictactoe-grid {
      display: grid;
      grid-template-columns: repeat(3, var(--cell-size));
      grid-template-rows: repeat(3, var(--cell-size));
      gap: var(--grid-gap);
      padding: 0.5rem;
      background: var(--color-card);
      border-radius: var(--radius-lg);
      border: 2px solid var(--color-border);
      box-shadow: var(--shadow-md);
      animation: subtle-rotate 8s ease-in-out infinite;
    }

    .grid-cell {
      width: var(--cell-size);
      height: var(--cell-size);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-muted);
      border-radius: var(--radius-sm);
      position: relative;
      overflow: hidden;
    }

    .grid-cell::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
      opacity: 0;
      animation: cell-pulse 2s ease-in-out infinite;
    }

    @keyframes cell-pulse {
      0%, 100% { opacity: 0; }
      50% { opacity: 0.15; }
    }

    @keyframes subtle-rotate {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(2deg); }
      50% { transform: rotate(0deg); }
      75% { transform: rotate(-2deg); }
    }

    .piece {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .piece svg {
      width: 80%;
      height: 80%;
    }

    .piece-x {
      color: var(--color-primary);
      animation: piece-fade-in 1.5s ease-in-out infinite;
    }

    .piece-x svg {
      filter: drop-shadow(0 0 4px rgba(20, 184, 166, 0.5));
    }

    .piece-o {
      color: var(--color-accent);
      animation: piece-fade-in 1.5s ease-in-out infinite;
    }

    .piece-o svg {
      filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.5));
    }

    .piece-empty {
      animation: piece-fade-in 1.5s ease-in-out infinite;
    }

    @keyframes piece-fade-in {
      0%, 100% {
        opacity: 0.2;
        transform: scale(0.8);
      }
      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .loading-message {
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 500;
      color: var(--color-foreground);
      text-align: center;
      margin: 0;
      animation: text-fade 1.5s ease-in-out infinite;
    }

    @keyframes text-fade {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .loading-spinner-container.inline .loading-message {
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <h1>TicTacToe Loading Spinner</h1>
    <div class="spinner-examples">
      <div class="example">
        <div class="example-label">Small - Signing In</div>
        <div class="loading-spinner-container inline">
          <div class="loading-spinner small">
            <div class="tictactoe-grid">
              <div class="grid-cell"><div class="piece piece-x" style="animation-delay: 0s;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 6L6 18M6 6l12 12" stroke-width="2.5" stroke-linecap="round" /></svg></div></div>
              <div class="grid-cell"><div class="piece piece-o" style="animation-delay: 0.15s;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8" stroke-width="2.5" /></svg></div></div>
              <div class="grid-cell"><div class="piece piece-empty" style="animation-delay: 0.3s;"></div></div>
              <div class="grid-cell"><div class="piece piece-x" style="animation-delay: 0.45s;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 6L6 18M6 6l12 12" stroke-width="2.5" stroke-linecap="round" /></svg></div></div>
              <div class="grid-cell"><div class="piece piece-o" style="animation-delay: 0.6s;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8" stroke-width="2.5" /></svg></div></div>
              <div class="grid-cell"><div class="piece piece-empty" style="animation-delay: 0.75s;"></div></div>
              <div class="grid-cell"><div class="piece piece-x" style="animation-delay: 0.9s;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 6L6 18M6 6l12 12" stroke-width="2.5" stroke-linecap="round" /></svg></div></div>
              <div class="grid-cell"><div class="piece piece-o" style="animation-delay: 1.05s;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8" stroke-width="2.5" /></svg></div></div>
              <div class="grid-cell"><div class="piece piece-empty" style="animation-delay: 1.2s;"></div></div>
            </div>
          </div>
          <p class="loading-message">Signing in...</p>
        </div>
      </div>

      <div class="example">
        <div class="example-label">Medium - Loading Game</div>
        <div class="loading-spinner-container">
          <div class="loading-spinner medium">
            <div class="tictactoe-grid">
              <div class="grid-cell"><div class="piece piece-x" style="animation-delay: 0s;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 6L6 18M6 6l12 12" stroke-width="2.5" stroke-linecap="round" /></svg></div></div>
              <div class="grid-cell"><div class="piece piece-o" style="animation-delay: 0.15s;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8" stroke-width="2.5" /></svg></div></div>
              <div class="grid-cell"><div class="piece piece-empty" style="animation-delay: 0.3s;"></div></div>
              <div class="grid-cell"><div class="piece piece-x" style="animation-delay: 0.45s;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 6L6 18M6 6l12 12" stroke-width="2.5" stroke-linecap="round" /></svg></div></div>
              <div class="grid-cell"><div class="piece piece-o" style="animation-delay: 0.6s;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8" stroke-width="2.5" /></svg></div></div>
              <div class="grid-cell"><div class="piece piece-empty" style="animation-delay: 0.75s;"></div></div>
              <div class="grid-cell"><div class="piece piece-x" style="animation-delay: 0.9s;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 6L6 18M6 6l12 12" stroke-width="2.5" stroke-linecap="round" /></svg></div></div>
              <div class="grid-cell"><div class="piece piece-o" style="animation-delay: 1.05s;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8" stroke-width="2.5" /></svg></div></div>
              <div class="grid-cell"><div class="piece piece-empty" style="animation-delay: 1.2s;"></div></div>
            </div>
          </div>
          <p class="loading-message">Loading game...</p>
        </div>
      </div>

      <div class="example">
        <div class="example-label">Large - Generating Analysis</div>
        <div class="loading-spinner-container">
          <div class="loading-spinner large">
            <div class="tictactoe-grid">
              <div class="grid-cell"><div class="piece piece-x" style="animation-delay: 0s;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 6L6 18M6 6l12 12" stroke-width="2.5" stroke-linecap="round" /></svg></div></div>
              <div class="grid-cell"><div class="piece piece-o" style="animation-delay: 0.15s;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8" stroke-width="2.5" /></svg></div></div>
              <div class="grid-cell"><div class="piece piece-empty" style="animation-delay: 0.3s;"></div></div>
              <div class="grid-cell"><div class="piece piece-x" style="animation-delay: 0.45s;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 6L6 18M6 6l12 12" stroke-width="2.5" stroke-linecap="round" /></svg></div></div>
              <div class="grid-cell"><div class="piece piece-o" style="animation-delay: 0.6s;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8" stroke-width="2.5" /></svg></div></div>
              <div class="grid-cell"><div class="piece piece-empty" style="animation-delay: 0.75s;"></div></div>
              <div class="grid-cell"><div class="piece piece-x" style="animation-delay: 0.9s;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 6L6 18M6 6l12 12" stroke-width="2.5" stroke-linecap="round" /></svg></div></div>
              <div class="grid-cell"><div class="piece piece-o" style="animation-delay: 1.05s;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8" stroke-width="2.5" /></svg></div></div>
              <div class="grid-cell"><div class="piece piece-empty" style="animation-delay: 1.2s;"></div></div>
            </div>
          </div>
          <p class="loading-message">Generating analysis with AI...</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
